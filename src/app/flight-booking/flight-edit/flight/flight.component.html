@let flightForm = flight();

<fieldset>
  <legend>Flight</legend>

  <div class="form-group">
    <label for="flight-id">ID</label>
    <input
      class="form-control"
      type="number"
      [formField]="flightForm.id"
      id="flight-id"
    />
  </div>

  <div class="form-group">
    <label for="flight-from">
      From
      <app-field-meta-data [formField]="flightForm.from" />
    </label>
    <input class="form-control" [formField]="flightForm.from" id="flight-from" />
    <app-validation-errors [errors]="flightForm.from().errors()" />
    @if (flightForm.from().pending()) {
    <div>Waiting for Async Validation Result...</div>
    }
  </div>

  <div class="form-group">
    <label for="flight-to">
      To
      <app-field-meta-data [formField]="flightForm.to" />
    </label>
    <input
      class="form-control"
      [formField]="flightForm.to"
      id="flight-to"
    />
  </div>

  <div class="form-group">
    <label for="flight-date">Date</label>
    <div class="input-group">
      <input
        class="form-control"
        [formField]="flightForm.date"
        id="flight-date"
        type="datetime-local"
      />
    </div>
  </div>

</fieldset>

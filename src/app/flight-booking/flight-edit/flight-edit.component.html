<div class="header">
  <h2 class="title">Flight Edit</h2>
</div>

@if (flight().id !== 0) {

<div>{{ flightForm().errors() | json }}</div>
<form class="flight-form" (ngSubmit)="save()">
  <div class="form-group">
    <label for="flight-id">ID</label>
    <input
      [formField]="flightForm.id"
      type="number"
      class="form-control"
      id="flight-id"
    />
  </div>

  <div class="form-group">
    <label for="flight-from">From</label>
    <input
      [formField]="flightForm.from"
      class="form-control"
      id="flight-from"
    />
    <div>{{ flightForm.from().errors() | json }}</div>
  </div>

  <div class="form-group">
    <label for="flight-to">To</label>
    <input
      [formField]="flightForm.to"
      class="form-control"
      id="flight-to"
    />
  </div>

  <div class="form-group">
    <label for="flight-date">Date</label>
    <div class="input-group">
      <input
        class="form-control"
        id="flight-date"
        [formField]="flightForm.date"
        type="datetime-local"
      />
    </div>
  </div>

  <div class="form-group form-check">
    <label class="form-check-label">
      <input
        type="checkbox"
        [formField]="flightForm.delayed"
        class="form-check-input"
        id="flight-delayed"
      />
      Delayed</label
    >
  </div>

  <div class="mt-20">
    <button class="btn btn-default" type="button" (click)="save()">Save</button>
  </div>
</form>
}

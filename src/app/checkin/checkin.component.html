
<div class="header">
  <h2 class="title">Check in</h2>
</div>

@if(error()) {
<p>{{ error() }}</p>
}

<pre>{{ ticket() | json }}</pre>
<form>
  <p>Check in to your flight now!</p>

  <div class="form-group">
    <input
      #fileInput
      type="file"
      hidden
      accept="image/png,image/jpeg"
      (change)="onFileSelected($event)"
    />
    <button type="button" class="btn btn-default" (click)="fileInput.click()">
      Upload Booking Confirmation
    </button>
  </div>

  @if(loading()) {
  <div class="ai-wait-indicator">
    <span></span>
    <span></span>
    <span></span>
  </div>
  } 
  
  @if(previewUrl) {
  <img [src]="previewUrl" alt="Preview" class="preview-image" />
  }

  <div class="form-group">
    <label>Booking Reference</label>
    <input
      class="form-control"
      name="ticketNumber"
      [(ngModel)]="ticket().bookingReference"
    />
  </div>

  <div class="form-group">
    <label>First Names</label>
    <input
      class="form-control"
      name="firstName"
      [(ngModel)]="ticket().firstName"
    />
  </div>

  <div class="form-group">
    <label>Last Names</label>
    <input
      class="form-control"
      name="lastName"
      [(ngModel)]="ticket().lastName"
    />
  </div>

  <div class="form-group">
    <label>I accept the general conditions of carriage.</label>
    <input type="checkbox" />
  </div>

  <div class="form-group">
    <input
      (click)="checkin()"
      type="button"
      class="btn btn-default"
      value="Check-in"
    />
  </div>
</form>

<ng-template #dialogMessage>
  <div class="success">
    <h1>You are checked-in now!</h1>
    <p>Please check your inbox for your ticket.</p>
    <div>
      <button (click)="close()">Close</button>
    </div>
  </div>
</ng-template>

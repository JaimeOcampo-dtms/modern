<h2>Your Next Flights</h2>

@for (flight of flights$ | async; track flight.id) {
<div class="mb-20">
    <app-flight-card [item]="flight" [selected]="false">
        <div>
            <button class="btn btn-default" (click)="checkIn(flight.id)">Check in</button>
        </div>
    </app-flight-card>
</div>
}

<app-checkin></app-checkin>

<article class="msg assistant">
  <div class="avatar">🤖</div>
  <div>
    <div class="bubble">Hi! How can I help you?</div>
    <div class="meta"></div>
  </div>
</article>

@for (message of messages(); track message.id) {
<article class="msg assistant">
  <div class="avatar">{{ icons[message.role] }}</div>
  
  @for(part of message.parts; track $index) {

    @switch (part.type) {
      @case('text') {
            <div>
      <div class="bubble">{{part.text }}</div>
      <div class="meta"></div>
    </div>

      }
      @default {
        {{part.type}}
      } 
    }
  }
</article>
} @if (showIndicator()) {
<article class="msg assistant">
  <div class="avatar">🤖</div>
  <div>
    <div class="bubble">
      <div class="ai-wait-indicator">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
</article>
}
